; ─────────────────────────────────────────────
; Desky – The Companion
; PlatformIO project configuration
; ─────────────────────────────────────────────

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; 160 MHz for smoother dual-OLED rendering
board_build.f_cpu = 160000000L

; Libraries
lib_deps =
    olikraus/U8g2@^2.35.19
    miguelbalboa/MFRC522@^1.4.11

; Serial monitor
monitor_speed = 115200

; Build flags
build_flags =
    -D DESKY_VERSION=\"1.0.0\"
    -w                          ; suppress warnings from bitmap data
